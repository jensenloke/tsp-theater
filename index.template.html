<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050a16'/%3E%3Cpath d='M7 22 L13 9 L25 13 L19 25 Z' fill='none' stroke='%2322d3ee' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='7' cy='22' r='2.6' fill='%234ade80'/%3E%3Ccircle cx='13' cy='9' r='2.6' fill='%23f5a623'/%3E%3Ccircle cx='25' cy='13' r='2.6' fill='%23e879f9'/%3E%3Ccircle cx='19' cy='25' r='2.6' fill='%23f5f7fa'/%3E%3C/svg%3E">
<title>TSP Theater — Singapore MRT</title>
<style>
:root{
  --bg:#050a16; --bg2:#0a1428; --panel:#0c1526; --panel2:#101c33;
  --line:rgba(148,180,255,.14); --text:#dfe8f8; --muted:#8fa2c2; --faint:#5d6f8f;
  --brute:#f5f7fa; --nn:#f5a623; --twoopt:#22d3ee; --sa:#e879f9; --exact:#4ade80;
  --router:#fb7185;
  --red:#f87171; --accent:#22d3ee;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, #0d1a36 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--text);
  font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select{font:inherit; color:var(--text)}
sup{font-size:.62em}
sub{font-size:.62em}

header{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px 10px; flex-wrap:wrap}
.brand h1{font-size:21px; font-weight:800; letter-spacing:.4px}
.brand h1 em{font-style:normal; color:var(--accent)}
.brand .tag{font-size:12px; color:var(--muted); margin-top:1px}
#test-badge{font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); cursor:pointer; white-space:nowrap}
#test-badge.pass{color:var(--exact); border-color:rgba(74,222,128,.4)}
#test-badge.fail{color:var(--red); border-color:rgba(248,113,113,.4)}

nav#scenes{display:flex; gap:8px; padding:0 20px 12px; overflow-x:auto; scrollbar-width:none}
nav#scenes::-webkit-scrollbar{display:none}
.scene-tab{display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:12px;
  border:1px solid var(--line); background:var(--panel); color:var(--muted);
  font-size:13px; font-weight:600; white-space:nowrap; transition:all .18s ease}
.scene-tab .num{display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:6px; font-size:11px; font-weight:800;
  background:rgba(148,180,255,.1); color:var(--muted)}
.scene-tab:hover{border-color:rgba(148,180,255,.32); color:var(--text)}
.scene-tab.active{color:#04101f; border-color:transparent}
.scene-tab.active .num{background:rgba(0,0,0,.22); color:inherit}
.scene-tab.active[data-scene="1"]{background:var(--brute)}
.scene-tab.active[data-scene="2"]{background:var(--nn)}
.scene-tab.active[data-scene="3"]{background:var(--twoopt)}
.scene-tab.active[data-scene="4"]{background:var(--sa)}
.scene-tab.active[data-scene="5"]{background:var(--exact)}
.scene-tab.active[data-scene="6"]{background:var(--router)}

main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:14px;
  padding:0 20px 12px; min-height:0}
#stage-wrap{display:flex; flex-direction:column; min-width:0; border:1px solid var(--line);
  border-radius:16px; overflow:hidden; background:linear-gradient(180deg,#081124 0%, #060d1d 100%)}
#ticker-bar{display:flex; align-items:baseline; gap:14px; padding:12px 18px;
  border-bottom:1px solid var(--line); background:rgba(10,18,38,.6); flex-wrap:wrap}
#ticker{font-size:34px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums;
  line-height:1.05; transition:color .3s}
#ticker .unit{font-size:15px; font-weight:600; color:var(--muted); margin-left:5px}
#ticker-meta{display:flex; flex-direction:column; gap:1px; min-width:0}
#ticker-label{font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.8px}
#ticker-status{font-size:12.5px; color:var(--muted); font-weight:600}
#stage-box{position:relative; flex:1; min-height:340px}
#stage{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:manipulation}
#tooltip{position:absolute; z-index:5; pointer-events:none; background:rgba(8,14,30,.94);
  border:1px solid rgba(148,180,255,.25); border-radius:9px; padding:6px 10px; font-size:12px;
  line-height:1.35; max-width:230px; box-shadow:0 6px 18px rgba(0,0,0,.5)}
#tooltip .tt-name{font-weight:700}
#tooltip .tt-sub{color:var(--muted); font-size:11px}
#map-hint{position:absolute; left:12px; bottom:10px; font-size:11px; color:var(--faint);
  pointer-events:none; background:rgba(6,11,24,.55); padding:3px 9px; border-radius:8px}

aside#panel{display:flex; flex-direction:column; gap:12px; min-width:0; overflow-y:auto;
  max-height:calc(100vh - 210px); scrollbar-width:thin; padding-right:2px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px}
.card h3{font-size:11px; text-transform:uppercase; letter-spacing:1.1px; color:var(--faint);
  font-weight:700; margin-bottom:10px}
.big-stat{font-size:38px; font-weight:800; letter-spacing:-.5px; line-height:1.1;
  font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.big-stat sup{font-size:.5em}
.stat-sub{font-size:12.5px; color:var(--muted); margin-top:5px}
.stat-row{display:flex; justify-content:space-between; gap:10px; font-size:13px;
  padding:4px 0; border-bottom:1px dashed rgba(148,180,255,.08)}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--muted)}
.stat-row .v{font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
.progress{height:7px; border-radius:99px; background:rgba(148,180,255,.1); overflow:hidden; margin-top:10px}
.progress .fill{height:100%; width:0%; border-radius:99px; transition:width .15s linear}
.caption{font-size:12.5px; color:var(--muted); margin-top:10px; padding:9px 12px;
  border-left:3px solid var(--accent); background:rgba(148,180,255,.05); border-radius:0 9px 9px 0}
.caption.warn{border-left-color:var(--nn)}
.caption.good{border-left-color:var(--exact)}
#explainer p{font-size:13.5px; color:var(--text); margin-bottom:8px}
#explainer .cx{display:inline-block; font-size:12px; font-weight:700; color:var(--accent);
  background:rgba(34,211,238,.08); border:1px solid rgba(34,211,238,.22);
  padding:3px 10px; border-radius:999px}
.ctl-row{display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12.5px}
.ctl-row label{color:var(--muted); min-width:86px; font-weight:600}
.ctl-row output{font-weight:700; font-variant-numeric:tabular-nums; min-width:56px; text-align:right}
.btn{padding:8px 16px; border-radius:11px; border:1px solid var(--line); background:var(--panel2);
  font-weight:700; font-size:13px; transition:all .15s ease; color:var(--text)}
.btn:hover:not(:disabled){border-color:rgba(148,180,255,.4); transform:translateY(-1px)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.primary{background:var(--accent); color:#04101f; border-color:transparent}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}

/* thermometer */
#thermo-wrap{display:flex; gap:16px; align-items:stretch}
#thermo{position:relative; width:26px; min-height:150px; border-radius:99px;
  background:rgba(148,180,255,.08); border:1px solid var(--line); overflow:hidden; flex:none}
#thermo .merc{position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(180deg, var(--sa) 0%, #7c3aed 100%);
  border-radius:99px 99px 0 0; transition:height .12s linear}
#thermo .tick{position:absolute; left:0; right:0; height:1px; background:rgba(223,232,248,.25)}
#thermo-info{flex:1; min-width:0}
#move-log{font-size:12px; color:var(--muted); margin-top:8px; min-height:34px;
  font-variant-numeric:tabular-nums}
#move-log .up{color:var(--nn); font-weight:700}
#move-log .down{color:var(--twoopt); font-weight:700}
#move-log .rej{color:var(--red); font-weight:700}

/* leaderboard */
#board{display:flex; flex-direction:column; gap:9px}
.board-row{display:grid; grid-template-columns:104px 1fr auto; gap:9px; align-items:center; font-size:12px}
.board-row .bname{color:var(--muted); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.board-row .btrack{height:16px; background:rgba(148,180,255,.07); border-radius:5px; overflow:hidden; position:relative}
.board-row .bbar{height:100%; width:0%; border-radius:5px; transition:width .9s cubic-bezier(.22,1,.36,1)}
.board-row .bref{position:absolute; top:0; bottom:0; width:2px; background:rgba(74,222,128,.85); box-shadow:0 0 6px rgba(74,222,128,.7)}
.board-row .bval{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.board-row .bgap{font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; margin-left:6px}
.bgap.ok{color:var(--exact); background:rgba(74,222,128,.12)}
.bgap.off{color:var(--nn); background:rgba(245,166,35,.12)}
.bgap.na{color:var(--faint); background:rgba(148,180,255,.08)}

/* route race (scene 6) */
#rr-table{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.rr-row{display:grid; grid-template-columns:92px 1fr auto; gap:8px; align-items:center; font-size:12px}
.rr-row .rname{font-weight:700; color:var(--muted); white-space:nowrap}
.rr-row.win .rname{color:var(--text)}
.rr-row .rtrack{height:14px; background:rgba(148,180,255,.07); border-radius:5px; overflow:hidden}
.rr-row .rfill{height:100%; width:0%; border-radius:5px; transition:width .18s linear}
.rr-row .rval{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; font-size:11.5px}
#rr-route{font-size:12.5px; line-height:1.8; margin-top:6px}
#rr-route .stop{white-space:nowrap}
.line-chip{display:inline-block; font-size:9.5px; font-weight:800; padding:0 5px; border-radius:5px;
  color:#04101f; margin:0 3px; vertical-align:1px}
.xfer-mark{color:var(--nn); font-weight:800; margin:0 2px}
.seg-btns{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px}
.seg{padding:6px 11px; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
  font-size:11.5px; font-weight:700; color:var(--muted); transition:all .15s ease}
.seg.active{background:var(--router); color:#20060c; border-color:transparent}
select.rr-select{width:100%; padding:7px 9px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel2); font-size:12.5px; font-weight:600; margin-top:3px}
.ctl-col{display:flex; flex-direction:column; gap:2px; margin:8px 0}
.ctl-col label{color:var(--muted); font-size:12px; font-weight:600}

footer#controls{display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px 20px 16px; border-top:1px solid var(--line); background:rgba(8,14,30,.72);
  backdrop-filter:blur(8px); position:sticky; bottom:0; z-index:10}
.transport{display:flex; gap:7px}
.tbtn{width:42px; height:42px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel2); font-size:16px; display:flex; align-items:center; justify-content:center;
  transition:all .15s ease}
.tbtn:hover{border-color:rgba(148,180,255,.4); transform:translateY(-1px)}
.tbtn.playing{background:var(--accent); color:#04101f; border-color:transparent}
.slider-group{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted)}
.slider-group output{font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; min-width:44px}
input[type=range]{-webkit-appearance:none; appearance:none; height:5px; border-radius:99px;
  background:rgba(148,180,255,.18); outline:none; cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:16px; height:16px;
  border-radius:50%; background:var(--accent); border:2px solid #06101f; box-shadow:0 0 8px rgba(34,211,238,.6)}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:2px solid #06101f}
#speed{width:110px}
#city-slider{width:120px}
#seed{width:76px; padding:7px 9px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel2); font-variant-numeric:tabular-nums; font-weight:700}
#kbd-hint{font-size:11px; color:var(--faint); margin-left:auto}
#toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(20px);
  background:rgba(10,17,34,.95); border:1px solid rgba(148,180,255,.3); color:var(--text);
  padding:9px 18px; border-radius:12px; font-size:13px; font-weight:600; opacity:0;
  transition:all .25s ease; pointer-events:none; z-index:50; max-width:86vw; text-align:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  header{padding:12px 14px 8px}
  nav#scenes{padding:0 14px 10px}
  main{grid-template-columns:1fr; padding:0 14px 10px; gap:10px}
  #stage-box{min-height:0; height:46vh}
  aside#panel{max-height:none; overflow:visible}
  #ticker{font-size:27px}
  footer#controls{gap:10px; padding:10px 14px 14px}
  #kbd-hint{display:none}
  .slider-group{flex:1 1 auto}
  #speed{width:84px}
  #city-slider{width:96px}
  .big-stat{font-size:31px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>TSP <em>Theater</em></h1>
    <div class="tag">The Traveling Salesman Problem on Singapore&rsquo;s MRT &middot; 213 stations, real coordinates</div>
  </div>
  <div id="test-badge" hidden></div>
</header>

<nav id="scenes" aria-label="Scenes">
  <button class="scene-tab" data-scene="1"><span class="num">1</span> The Explosion</button>
  <button class="scene-tab" data-scene="2"><span class="num">2</span> Nearest Neighbor</button>
  <button class="scene-tab" data-scene="3"><span class="num">3</span> 2-opt</button>
  <button class="scene-tab" data-scene="4"><span class="num">4</span> Annealing</button>
  <button class="scene-tab" data-scene="5"><span class="num">5</span> The Exact Answer</button>
  <button class="scene-tab" data-scene="6"><span class="num">6</span> Route Race</button>
</nav>

<main>
  <section id="stage-wrap">
    <div id="ticker-bar">
      <div id="ticker">0.00<span class="unit">km</span></div>
      <div id="ticker-meta">
        <div id="ticker-label">tour length &middot; straight-line, as the crow flies</div>
        <div id="ticker-status">ready</div>
      </div>
    </div>
    <div id="stage-box">
      <canvas id="stage"></canvas>
      <div id="tooltip" hidden></div>
      <div id="map-hint">click map: add city &middot; click city: remove</div>
    </div>
  </section>
  <aside id="panel">
    <div class="card" id="scene-stats"></div>
    <div class="card" id="explainer-card"><h3>The idea</h3><div id="explainer"></div></div>
    <div class="card" id="scene-controls-card"><h3>Scene controls</h3><div id="scene-controls"></div></div>
  </aside>
</main>

<footer id="controls">
  <div class="transport">
    <button class="tbtn" id="btn-play" title="Play / pause (space)">&#9654;</button>
    <button class="tbtn" id="btn-step" title="Single step (&rarr;)">&#9197;</button>
    <button class="tbtn" id="btn-reset" title="Reset (R)">&#8634;</button>
  </div>
  <div class="slider-group"><label for="speed">speed</label>
    <input type="range" id="speed" min="-2" max="3" step="0.25" value="0"><output id="speed-out">1×</output></div>
  <div class="slider-group"><label for="city-slider">cities</label>
    <input type="range" id="city-slider" min="5" max="20" step="1" value="12"><output id="city-out">12</output></div>
  <div class="slider-group"><label for="seed">seed</label>
    <input type="number" id="seed" value="42" min="0" step="1"></div>
  <div id="kbd-hint">space play/pause &middot; &rarr; step &middot; 1&ndash;6 scenes &middot; R reset</div>
</footer>
<div id="toast"></div>

<script>__DATA_JS__</script>
<script>
'use strict';
/* ================================================================
   TSP Theater — vanilla JS + Canvas 2D, zero dependencies.
   All distances are haversine great-circle km ("as the crow flies"),
   computed at runtime from real MRT station coordinates.
   ================================================================ */
const D = window.TSP_DATA;
const $ = (s) => document.querySelector(s);
const COLORS = { brute:'#f5f7fa', nn:'#f5a623', twoopt:'#22d3ee', sa:'#e879f9', exact:'#4ade80', router:'#fb7185' };
const SCENE_COLOR = { 1:COLORS.brute, 2:COLORS.nn, 3:COLORS.twoopt, 4:COLORS.sa, 5:COLORS.exact, 6:COLORS.router };
const SCENE_NAME = { 1:'Brute force', 2:'Nearest neighbor', 3:'2-opt local search', 4:'Simulated annealing', 5:'Held–Karp exact', 6:'Route race' };
const MAX_CITIES = 24, MIN_CITIES = 4, HK_LIMIT = 15, ENUM_LIMIT = 8;
const UNIVERSE_YEARS = 13.8e9;

/* ---------------- math & formatting ---------------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function haversine(lat1, lon1, lat2, lon2){
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2 * D.radiusKm * Math.asin(Math.min(1, Math.sqrt(h)));
}
function buildMatrix(cities){
  const n = cities.length, M = new Float64Array(n*n);
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
    const d = haversine(cities[i].lat, cities[i].lon, cities[j].lat, cities[j].lon);
    M[i*n+j] = d; M[j*n+i] = d;
  }
  return M;
}
function tourCost(tour, M){
  const n = tour.length; let s = 0;
  for (let i=0;i<n;i++) s += M[tour[i]*n + tour[(i+1)%n]];
  return s;
}
function pathCost(path, M){ // open path, no closing edge
  const n = path.length; let s = 0;
  for (let i=1;i<n;i++) s += M[path[i-1]*n + path[i]];
  return s;
}
function isPermutation(tour, n){
  if (!tour || tour.length !== n) return false;
  const seen = new Uint8Array(n);
  for (const v of tour){ if (!Number.isInteger(v) || v<0 || v>=n || seen[v]) return false; seen[v]=1; }
  return true;
}
function fmtBig(n){
  if (!isFinite(n)) return '∞';
  if (n < 1e6) return Math.round(n).toLocaleString('en-US');
  const e = Math.floor(Math.log10(n));
  const m = n / Math.pow(10, e);
  return m.toFixed(2) + '×10<sup>' + e + '</sup>';
}
function fmtTime(sec){
  if (sec < 1e-3) return (sec*1e6).toFixed(1) + ' µs';
  if (sec < 1) return (sec*1e3).toFixed(1) + ' ms';
  if (sec < 60) return sec.toFixed(1) + ' s';
  if (sec < 3600) return (sec/60).toFixed(1) + ' min';
  if (sec < 86400) return (sec/3600).toFixed(1) + ' hours';
  if (sec < 365.25*86400) return (sec/86400).toFixed(1) + ' days';
  const yr = sec / (365.25*86400);
  if (yr < 1000) return yr.toFixed(2) + ' years';
  if (yr < 1e6) return (yr/1000).toFixed(1) + ' thousand years';
  if (yr < 1e9) return (yr/1e6).toFixed(1) + ' million years';
  if (yr < 1e12) return (yr/1e9).toFixed(2) + ' billion years';
  return fmtBig(yr) + ' years';
}
function distinctTours(n){
  let f = 1;
  for (let k=2;k<=n-1;k++) f *= k;
  return f/2;
}
const easeOutCubic = t => 1 - Math.pow(1-t, 3);
const easeInOut = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function drain(gen){ for (const ev of gen){ if (ev.type === 'done') return ev; } return null; }
/* ---------------- algorithms (pure; seeded wherever random) ---------------- */
function* bruteGen(M, n){
  // Fix city 0 first; keep only tours with tour[1] < tour[n-1] (one per direction)
  // so the enumerated count is exactly (n-1)!/2 distinct loops.
  const rest = []; for (let i=1;i<n;i++) rest.push(i);
  let best = null, bestCost = Infinity, count = 0;
  function* perms(k){
    if (k === rest.length){ yield rest.slice(); return; }
    for (let i=k;i<rest.length;i++){
      [rest[k], rest[i]] = [rest[i], rest[k]];

function computeProjection(){

  const add = (lon,lat) => {
    const x = lon*KX, y = -lat;
    if (x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  };
  for (const ring of D.island) for (const p of ring) add(p[0],p[1]);
  for (const c of G.cities) add(c.lon, c.lat);

  const w = Math.max(50, CW - pad*2), h = Math.max(50, CH - pad*2);
  const s = Math.min(w/(maxX-minX), h/(maxY-minY));
  G.proj = { s, ox: pad + (w - (maxX-minX)*s)/2 - minX*s, oy: pad + (h - (maxY-minY)*s)/2 - minY*s };

}
function drawBase(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,CW,CH);
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#081124'); g.addColorStop(1,'#050b18');
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);
  // island silhouette (simplified region polygons, one dark landmass)
  ctx.save();
  ctx.beginPath();
  for (const ring of D.island){
    const p0 = toScreen(ring[0][0], ring[0][1]);
    ctx.moveTo(p0[0], p0[1]);
    for (let i=1;i<ring.length;i++){ const p = toScreen(ring[i][0], ring[i][1]); ctx.lineTo(p[0],p[1]); }
    ctx.closePath();
  }
  ctx.shadowColor = 'rgba(59,130,246,.4)'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#0f1d36'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(125,165,225,.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  // inactive stations: faint context dots
  const active = new Set(G.cities.map(c => c.name));
  ctx.save();
  ctx.fillStyle = 'rgba(140,165,205,.34)';
  for (const s of D.stations){
    if (active.has(s.name)) continue;
    const [x,y] = toScreen(s.lon, s.lat);
    ctx.beginPath(); ctx.arc(x,y,1.4,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawCities(color, startIdx, pulseT){
  labelRects.length = 0;
  const pos = [];
  for (let i=0;i<G.n;i++){
    const pulse = (i === startIdx && pulseT != null) ? (pulseT % 1) : 0;
    pos.push(drawCityDot(i, color, CW < 560 ? 4.4 : 5.4, pulse));
  }
  for (let i=0;i<G.n;i++) drawLabel(i, pos[i][0], pos[i][1], '#c9d8f2');

function drawFlow(pts, color, closed){
  // subtle moving sparkle along the tour
  if (pts.length < 2) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (closed) ctx.closePath();
  ctx.setLineDash([2, 16]);
  ctx.lineDashOffset = -G.time * 26;
  ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = .3; ctx.lineWidth = 1.1;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}
function edgeHit(x, y, tour){
  if (!tour || tour.length < 2) return null;
  const n = tour.length;
  let best = null;
  for (let i=0;i<n;i++){
    const A = toScreen(G.cities[tour[i]].lon, G.cities[tour[i]].lat);
    const B = toScreen(G.cities[tour[(i+1)%n]].lon, G.cities[tour[(i+1)%n]].lat);
    const dx=B[0]-A[0], dy=B[1]-A[1];
    const L2 = dx*dx+dy*dy;
    const t = L2 ? clamp(((x-A[0])*dx+(y-A[1])*dy)/L2, 0, 1) : 0;
    const d = Math.hypot(x-(A[0]+t*dx), y-(A[1]+t*dy));
    if (d < 7 && (!best || d < best.d))
      best = { d, a:tour[i], b:tour[(i+1)%n], km:G.M[tour[i]*n+tour[(i+1)%n]] };
  }
  return best;
}

function gapText(km, n){
  if (n > HK_LIMIT) return 'exact intractable &gt;15';
  const ex = drain(hkGen(G.M, n, 0));
  const gap = (km - ex.cost)/ex.cost*100;
  return Math.abs(gap) < 0.005 ? 'matches exact ✓'
    : `+${gap.toFixed(1)}% (exact ${ex.cost.toFixed(2)} km)`;
}

/* ---- Scene 3: 2-opt (local search) — the money shot ---- */
function doubleBridge(tour, rng){
  const n = tour.length, cuts = [];
  while (cuts.length < 3){
    const c = 1 + Math.floor(rng()*(n-1));
    if (!cuts.includes(c)) cuts.push(c);
  }
  cuts.sort((a,b)=>a-b);
  const [a,b,c] = cuts;
  return tour.slice(0,a).concat(tour.slice(b,c), tour.slice(a,b), tour.slice(c));
}

/* ---- Scene 6: Route Race (BFS vs Dijkstra vs A* on the real network) ---- */
const RR = { obj:'time', src:NIDX['Kovan'], dst:{poi:NET.pois[0]}, hopMin:2, xferMin:4, preset:0 };
const LANE_META = [
  { key:'bfs', name:'BFS', tag:'fewest stops', color:'#94a3b8' },
  { key:'dij', name:'Dijkstra', tag:'cost order', color:'#38bdf8' },
  { key:'ast', name:'A*', tag:'goal-directed', color:'#4ade80' },
];
const OBJ_LABEL = { stops:'fewest stops', time:'fastest door-to-door', transfers:'fewest transfers' };
function rrDstName(){ return RR.dst.poi ? RR.dst.poi.name : NODE[RR.dst.station].name; }
function rrTotal(r){ return r.minutes + (RR.dst.poi ? r.walk : 0); }
function rrObjCost(r){ return RR.obj === 'stops' ? r.stops : RR.obj === 'transfers' ? r.transfers : rrTotal(r); }
function rrWinner(S){
  let best = null;
  for (const l of S.lanes){ if (!l.result) continue;
    const c = rrObjCost(l.result);
    if (!best || c < best.c - 1e-9 || (Math.abs(c-best.c) <= 1e-9 && l.result.explored < best.r.explored))
      best = { key:l.key, c, r:l.result, color:l.color, name:l.name };
  }
  return best;
}
function rrSyncSelects(){
  const s = $('#rr-src'), d = $('#rr-dst'), p = $('#rr-preset');
  if (s) s.value = String(RR.src);
  if (d) d.value = RR.dst.poi ? 'poi:' + NET.pois.indexOf(RR.dst.poi) : 'st:' + RR.dst.station;
  if (p) p.value = String(RR.preset);
}
function rrRenderRoute(S){
  const w = S.winner; if (!w) return;
  const r = w.r;
  let html = '', prev = null;
  r.path.forEach((st,i) => {
    if (i > 0){
      const L = r.lines[i-1];
      if (prev && L !== prev) html += '<span class="xfer-mark">⇄</span>';
      html += `<span class="line-chip" style="background:${NET.lines[L].color}">${L}</span>`;
      prev = L;
    } else prev = r.lines[0] || null;
    html += `<span class="stop">${NODE[st].name}</span> `;
  });
  if (RR.dst.poi && r.walk > 0)
    html += `<div class="stat-sub" style="margin-top:4px">+ ${r.walk} min walk → ${RR.dst.poi.name}</div>`;
  $('#rr-route').innerHTML = html;
  const cap = $('#rr-cap');
  cap.hidden = false;
  const bfs = S.lanes[0].result;
  if (RR.obj === 'time' && bfs && rrTotal(bfs) > rrTotal(r) + 1e-9){
    cap.className = 'caption warn';
    cap.innerHTML = `BFS found the fewest stops (${bfs.stops}) but ${rrTotal(bfs).toFixed(0)} min door-to-door.
      ${w.name} chose ${r.stops} stops for ${rrTotal(r).toFixed(0)} min — <b>more stops, faster journey</b>.
      Fewest stops ≠ fastest.`;
  } else if (RR.obj === 'stops'){
    cap.className = 'caption good';
    cap.textContent = 'All three agree on the minimum stop count — BFS is provably optimal here, and Dijkstra/A* match it.';
  } else if (RR.obj === 'transfers'){
    cap.className = 'caption good';
    cap.textContent = `Minimum transfers: ${r.transfers}. BFS still minimizes stops — watch it take a different route.`;
  } else {
    cap.className = 'caption good';
    cap.textContent = `${w.name} wins at ${rrTotal(r).toFixed(0)} min door-to-door. A* matched Dijkstra's optimum while settling fewer states.`;
  }
}

/* panel layout + projection */
const NETB = (() => {
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  const add = (lon,lat) => { const x=lon*KX, y=-lat;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; };
  for (const ring of D.island) for (const p of ring) add(p[0],p[1]);
  for (const nd of NODE) add(nd.lon, nd.lat);
  return {minX,maxX,minY,maxY};
})();
function rrRects(){
  const rects = [], m = 10, gap = 10;
  if (CW >= 640){
    const w = (CW - m*2 - gap*2)/3;
    for (let i=0;i<3;i++) rects.push({x:m+i*(w+gap), y:m, w, h:CH-m*2});
  } else {
    const h = (CH - m*2 - gap*2)/3;
    for (let i=0;i<3;i++) rects.push({x:m, y:m+i*(h+gap), w:CW-m*2, h});
  }
  return rects;
}
function rrProj(rect){
  const pad = 8, head = 26;
  const w = Math.max(20, rect.w-pad*2), h = Math.max(20, rect.h-head-pad*2);
  const s = Math.min(w/(NETB.maxX-NETB.minX), h/(NETB.maxY-NETB.minY));
  return { s, ox: rect.x+pad+(w-(NETB.maxX-NETB.minX)*s)/2 - NETB.minX*s,
              oy: rect.y+head+pad+(h-(NETB.maxY-NETB.minY)*s)/2 - NETB.minY*s };
}
const rrPt = (lon,lat,p) => [p.ox+lon*KX*p.s, p.oy-lat*p.s];
function drawRacePanel(S, lane, rect){
  const p = rrProj(rect);
  const isWin = S.winner && S.winner.key === lane.key;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 12);
  ctx.fillStyle = 'rgba(8,14,30,.55)'; ctx.fill();
  if (isWin){ ctx.shadowColor = lane.color; ctx.shadowBlur = 16; ctx.strokeStyle = lane.color; ctx.lineWidth = 1.6; }
  else { ctx.strokeStyle = 'rgba(148,180,255,.16)'; ctx.lineWidth = 1; }
  ctx.stroke(); ctx.shadowBlur = 0;
  ctx.clip();
  // island
  ctx.beginPath();
  for (const ring of D.island){
    const q0 = rrPt(ring[0][0], ring[0][1], p); ctx.moveTo(q0[0], q0[1]);
    for (let i=1;i<ring.length;i++){ const q = rrPt(ring[i][0], ring[i][1], p); ctx.lineTo(q[0],q[1]); }
    ctx.closePath();
  }
  ctx.fillStyle = '#0f1d36'; ctx.fill();
  ctx.strokeStyle = 'rgba(125,165,225,.22)'; ctx.lineWidth = .8; ctx.stroke();
  // line edges
  ctx.lineWidth = 1.1; ctx.globalAlpha = .38;
  for (const [a,b,L] of NET.edges){
    const A = rrPt(NODE[a].lon, NODE[a].lat, p), B = rrPt(NODE[b].lon, NODE[b].lat, p);
    ctx.strokeStyle = NET.lines[L].color;
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // stations: base, settled, wave
  for (let i=0;i<NODE.length;i++){
    const q = rrPt(NODE[i].lon, NODE[i].lat, p);
    ctx.beginPath(); ctx.arc(q[0],q[1],1.4,0,7);
    ctx.fillStyle = 'rgba(140,165,205,.4)'; ctx.fill();
    if (lane.settled[i]){
      ctx.beginPath(); ctx.arc(q[0],q[1],2.1,0,7);
      ctx.fillStyle = lane.color; ctx.globalAlpha = .8; ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  for (const wv of lane.recent){
    if (wv.age > .8) continue;
    const q = rrPt(NODE[wv.st].lon, NODE[wv.st].lat, p);
    ctx.beginPath(); ctx.arc(q[0],q[1],2.5+wv.age*11,0,7);
    ctx.strokeStyle = lane.color; ctx.globalAlpha = .5*(1-wv.age/.8); ctx.lineWidth = 1.4;
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  // winning path
  if (lane.result){
    const pts = lane.result.path.map(i => rrPt(NODE[i].lon, NODE[i].lat, p));
    glowLine(pts, lane.color, 2.2, .95, false);
  }
  // origin / destination markers
  const mark = (i, color, letter) => {
    const q = rrPt(NODE[i].lon, NODE[i].lat, p);
    ctx.beginPath(); ctx.arc(q[0],q[1],4.4,0,7);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.font = '800 9px -apple-system, sans-serif'; ctx.fillStyle = color;
    ctx.fillText(letter, q[0]+6, q[1]-5);
  };
  mark(RR.src, '#f5f7fa', 'A');
  if (RR.dst.poi){
    for (const [wi] of RR.dst.poi.walkIdx) mark(wi, 'rgba(251,113,133,.65)', '');
    const q = rrPt(RR.dst.poi.lon, RR.dst.poi.lat, p);
    ctx.font = '800 11px -apple-system, sans-serif'; ctx.fillStyle = COLORS.router;
    ctx.shadowColor = COLORS.router; ctx.shadowBlur = 8;
    ctx.fillText('★', q[0]-5, q[1]+4); ctx.shadowBlur = 0;
  } else mark(RR.dst.station, COLORS.router, 'B');
  // header
  ctx.font = '800 12.5px -apple-system, "Segoe UI", sans-serif';
  ctx.fillStyle = lane.color; ctx.fillText(lane.name, rect.x+10, rect.y+17);
  const nameW = ctx.measureText(lane.name).width;
  ctx.font = '600 9.5px -apple-system, sans-serif'; ctx.fillStyle = 'rgba(143,162,194,.9)';
  ctx.fillText(lane.tag, rect.x+10+nameW+8, rect.y+17);
  ctx.textAlign = 'right';
  ctx.font = '700 10px -apple-system, sans-serif';
  ctx.fillStyle = lane.result ? lane.color : 'rgba(143,162,194,.9)';
  ctx.fillText(lane.result
    ? `${lane.result.stops} stops · ${rrTotal(lane.result).toFixed(0)} min · ${lane.result.explored} settled`
    : lane.explored + ' settled', rect.x+rect.w-10, rect.y+17);
  ctx.textAlign = 'left';
  ctx.restore();
}

let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.1, Math.max(0, (now - lastT)/1000));
  lastT = now; G.time += dt;
  const sc = SCENES[G.scene];
  if (G.S){
    sc.update(G.S, G.playing ? dt : 0);
    if (G.playing && isDone(G.S)) togglePlay(false);
    SCENES[G.scene].draw(G.S);
  }
  // animated distance ticker
  const tk = G.ticker;
  tk.shown += (tk.target - tk.shown) * (1 - Math.exp(-dt*9));
  if (Math.abs(tk.target - tk.shown) < 0.004) tk.shown = tk.target;
  const el = $('#ticker');
  el.innerHTML = tk.shown.toFixed(2) + '<span class="unit">' + (G.scene === 6 ? 'min' : 'km') + '</span>';
  el.style.color = SCENE_COLOR[G.scene];
  requestAnimationFrame(frame);
}

function netHit(x, y){
  const rect = rrRects()[0], p = rrProj(rect);
  let best = null;
  for (let i=0;i<NODE.length;i++){
    const q = rrPt(NODE[i].lon, NODE[i].lat, p);
    const d = Math.hypot(x-q[0], y-q[1]);
    if (d < 12 && (!best || d < best.d)) best = { i, d };
  }
  return best;
}
function cityHit(x, y){
  let best = null;
  for (let i=0;i<G.n;i++){
    const [cx,cy] = toScreen(G.cities[i].lon, G.cities[i].lat);
    const d = Math.hypot(x-cx, y-cy);
    if (d < 14 && (!best || d < best.d)) best = { i, d };
  }
  return best;
}

/* ---------------- self-tests (?test=1) ---------------- */
function runTests(){
  const groups = [];
  const T = (name, fn) => {
    try { const r = fn(); groups.push({ name, pass: !!r.pass, detail: r.detail || '' }); }
    catch (err){ groups.push({ name, pass:false, detail:String(err.message || err).slice(0,160) }); }
  };
  const sample = (n, seed) => {
    const idx = shuffledTour(D.stations.length, mulberry32(seed)).slice(0, n);
    return idx.map(i => D.stations[i]);
  };
  T('1 · tour validity — every algorithm outputs a permutation', () => {
    const cs = sample(8, 7), M = buildMatrix(cs), n = 8;
    const tours = [
      drain(bruteGen(M, n)).tour,
      nnFrom(M, n, 0),
      drain(twoOptGen(M, n, shuffledTour(n, mulberry32(11)))).tour,
      drain(saGen(M, n, shuffledTour(n, mulberry32(12)), mulberry32(13), 10, .99, .02)).tour,
      drain(hkGen(M, n, 0)).tour,
    ];
    const ok = tours.every(t => isPermutation(t, n));
    return { pass: ok, detail: ok ? 'brute / NN / 2-opt / SA / HK all valid' : 'invalid permutation found' };
  });
  T('2 · brute force ≡ Held–Karp (n=6,7,8 × 3 seeds)', () => {
    let worst = 0, checks = 0;
    for (const n of [6,7,8]) for (const seed of [1,2,3]){
      const cs = sample(n, seed), M = buildMatrix(cs);
      const b = drain(bruteGen(M, n)), h = drain(hkGen(M, n, 0));
      const dh = Math.abs(tourCost(h.tour, M) - h.cost);
      worst = Math.max(worst, Math.abs(b.cost - h.cost), dh);
      if (!isPermutation(h.tour, n)) return { pass:false, detail:'HK tour invalid' };
      checks++;
    }
    return { pass: worst < 1e-9, detail: `${checks} comparisons · max Δ ${worst.toExponential(2)} km` };
  });
  T('3 · 2-opt monotone + no improving move at the end', () => {
    const cs = sample(12, 42), M = buildMatrix(cs), n = 12;
    const t0 = shuffledTour(n, mulberry32(42));
    let last = tourCost(t0, M), swaps = 0, mono = true;
    const gen = twoOptGen(M, n, t0);
    let final = null;
    for (const ev of gen){
      if (ev.type === 'swap'){ if (ev.newCost > last + 1e-9) mono = false; last = ev.newCost; swaps++; }
      else if (ev.type === 'done') final = ev;
    }
    const improving = final ? twoOptImprove(M, final.tour) : null;
    const ok = mono && swaps > 0 && final && improving === null && Math.abs(last - final.cost) < 1e-9;
    return { pass: ok, detail: `${swaps} swaps · monotone ${mono} · improving move left: ${improving ? improving.delta.toFixed(4) : 'none'}` };
  });
  T('4 · annealing improves + acceptance math = exp(−Δ/T)', () => {
    const cs = D.defaults, M = buildMatrix(cs), n = cs.length;
    const t0 = shuffledTour(n, mulberry32((42 ^ 0xc2b2ae35) >>> 0));
    const init = tourCost(t0, M);
    const sa = drain(saGen(M, n, t0, mulberry32((42 ^ 0x27d4eb2f) >>> 0), 10, .995, .02));
    const p1 = saProb(0, 5) === 1 && saProb(-3, 5) === 1;
    const p2 = Math.abs(saProb(2, 4) - Math.exp(-0.5)) < 1e-12;
    const p3 = saAccept(2, 4, 0.5) === (0.5 < Math.exp(-0.5)) && saAccept(2, 4, 0) && !saAccept(2, 4, 1);
    const ok = sa.cost <= init + 1e-9 && p1 && p2 && p3;
    return { pass: ok, detail: `init ${init.toFixed(2)} → final ${sa.cost.toFixed(2)} km · prob checks ${p1&&p2&&p3}` };
  });
  T('5 · haversine sanity (known cross-island pairs)', () => {
    const je = D.stations.find(s => s.name === 'Jurong East');
    const cg = D.stations.find(s => s.name === 'Changi Airport');
    const bl = D.stations.find(s => s.name === 'Boon Lay');
    const d1 = haversine(je.lat, je.lon, cg.lat, cg.lon);
    const d1r = haversine(cg.lat, cg.lon, je.lat, je.lon);
    const d2 = haversine(bl.lat, bl.lon, cg.lat, cg.lon);
    const self = haversine(je.lat, je.lon, je.lat, je.lon);
    // JE<->CG true great-circle ≈ 27.5 km; Boon Lay<->CG ≈ 31.5 km (30–35 band).
    const ok = d1 >= 27 && d1 <= 28.5 && d2 >= 30 && d2 <= 35
      && Math.abs(d1-d1r) < 1e-12 && self === 0;
    return { pass: ok, detail: `JE↔CG ${d1.toFixed(3)} km · BL↔CG ${d2.toFixed(3)} km · symmetry Δ ${Math.abs(d1-d1r).toExponential(1)} · self ${self}` };
  });
  T('6 · determinism — same seed ⇒ identical move sequences', () => {
    const cs = sample(10, 99), M = buildMatrix(cs), n = 10;
    const sig2 = () => {
      const g = twoOptGen(M, n, shuffledTour(n, mulberry32(555)));
      const out = [];
      for (const ev of g) if (ev.type === 'swap') out.push(ev.i + ':' + ev.j + ':' + ev.newCost.toFixed(9));
      return out.join('|');
    };
    const sigSA = () => {
      const g = saGen(M, n, shuffledTour(n, mulberry32(556)), mulberry32(557), 8, .99, .02);
      const out = [];
      for (const ev of g) if (ev.type === 'move') out.push(ev.k + ':' + ev.delta.toFixed(9) + ':' + ev.accept);
      return out.join('|');
    };
    const a = sig2(), b = sig2(), c = sigSA(), d = sigSA();
    const ok = a === b && c === d && a.length > 0 && c.length > 0;
    return { pass: ok, detail: `2-opt ${a.split('|').length} swaps identical · SA ${c.split('|').length} moves identical` };
  });
  T('7 · (n−1)!/2 counter matches enumerated distinct tours', () => {
    const cs5 = sample(5, 3), cs6 = sample(6, 4);
    const c5 = drain(bruteGen(buildMatrix(cs5), 5)).count;
    const c6 = drain(bruteGen(buildMatrix(cs6), 6)).count;
    const ok = c5 === 12 && c6 === 60 && distinctTours(5) === 12 && distinctTours(6) === 60;
    return { pass: ok, detail: `n=5 → ${c5} (expect 12) · n=6 → ${c6} (expect 60)` };
  });
  T('8 · router: BFS stop-optimality, Dijkstra ≡ A*, monotone penalties, determinism', () => {
    const pairs = [['Kovan','Shenton Way'],['Woodlands','Changi Airport'],['Jurong East','Marina Bay']];
    let ok = true, worst = 0;
    for (const [a,b] of pairs){
      const src = NIDX[a], dst = {station:NIDX[b]};
      const bf = drain(bfsGen(src, dst, 2, 4));
      const dj = drain(wsearchGen('dijkstra', src, dst, 'time', 2, 4));
      const as = drain(wsearchGen('astar', src, dst, 'time', 2, 4));
      worst = Math.max(worst, Math.abs(dj.cost - as.cost));
      ok = ok && bf.stops <= dj.stops && Math.abs(dj.cost - as.cost) < 1e-9 && as.explored <= dj.explored;
      ok = ok && dj.path[0] === src && dj.path[dj.path.length-1] === dst.station;
      for (let i=1;i<dj.path.length;i++) ok = ok && ADJ[dj.path[i-1]].some(e => e.to === dj.path[i]);
      for (let i=1;i<bf.path.length;i++) ok = ok && ADJ[bf.path[i-1]].some(e => e.to === bf.path[i]);
    }
    const bf9 = drain(bfsGen(NIDX['Kovan'], {station:NIDX['Raffles Place']}, 2, 4));
    ok = ok && bf9.stops === 9;
    // the close fight: door-to-door optimum beats the fewest-stops route
    const poi = {poi:NET.pois[0]};
    const bfP = drain(bfsGen(NIDX['Kovan'], poi, 2, 4));
    const djP = drain(wsearchGen('dijkstra', NIDX['Kovan'], poi, 'time', 2, 4));
    ok = ok && djP.minutes + djP.walk <= bfP.minutes + bfP.walk + 1e-9;
    // raising the transfer penalty never lowers the optimal cost
    const c0 = drain(wsearchGen('dijkstra', NIDX['Kovan'], poi, 'time', 2, 0)).cost;
    const c8 = drain(wsearchGen('dijkstra', NIDX['Kovan'], poi, 'time', 2, 8)).cost;
    ok = ok && c8 >= c0 - 1e-9;
    const sig = () => {
      const g = wsearchGen('astar', NIDX['Kovan'], poi, 'time', 2, 4), o = [];
      for (const ev of g) if (ev.type === 'settle') o.push(ev.state + ':' + ev.cost.toFixed(6));
      return o.join('|');
    };
    ok = ok && sig() === sig();
    return { pass: ok, detail: `3 OD pairs · max Δ(Dij,A*) ${worst.toExponential(2)} min · Kovan→Raffles Pl ${bf9.stops} stops · door-to-door ${djP.minutes+djP.walk} vs BFS ${bfP.minutes+bfP.walk} min` };
  });
  const passed = groups.filter(g => g.pass).length;
  console.log('%cTSP Theater self-test', 'font-weight:bold;font-size:14px');
  console.table(groups.map(g => ({ group: g.name, result: g.pass ? 'PASS' : 'FAIL', detail: g.detail })));
  const badge = $('#test-badge');
  badge.hidden = false;
  badge.textContent = `self-test ${passed}/${groups.length} ${passed === groups.length ? 'PASS' : 'FAIL'}`;
  badge.className = passed === groups.length ? 'pass' : 'fail';
  badge.onclick = () => console.table(groups.map(g => ({ group:g.name, result:g.pass?'PASS':'FAIL', detail:g.detail })));
  window.__tsp.testResults = groups;
  return groups;
}

/* ---------------- public hooks (showcase / tests) ---------------- */
window.__tsp = {
  G, SCENES, COLORS, NET, NODE, NIDX, RR,
  state: () => ({ scene:G.scene, n:G.n, seed:G.seed, playing:G.playing, speed:G.speed,
    ticker:G.ticker.target, done:isDone(G.S),
    swaps: G.S && G.S.swaps, moves: G.S && G.S.kTotal, phase: G.S && G.S.phase,
    checked: G.S && G.S.checked, total: G.S && G.S.total,
    board: G.S && G.S.board ? G.S.board.rows.map(r => ({ key:r.key, km:r.km, gapLabel:r.gapLabel })) : null,
    rr: G.scene === 6 && G.S ? { obj:RR.obj, src:NODE[RR.src].name, dst:rrDstName(),
      winner: G.S.winner && G.S.winner.key,
      winnerTotal: G.S.winner ? rrTotal(G.S.winner.r) : null,
      lanes: G.S.lanes.map(l => ({ key:l.key, explored:l.explored,
        result: l.result ? { stops:l.result.stops, transfers:l.result.transfers,
          minutes:l.result.minutes, walk:l.result.walk, total:rrTotal(l.result), explored:l.result.explored } : null })) } : null }),
  setScene: (k) => switchScene(k, true),
  setCities: (k) => setCities(citiesFromSlider(k), true),
  setSeed: (s) => { G.seed = s >>> 0; $('#seed').value = G.seed; resetRun(true); },
  play: () => togglePlay(true),
  pause: () => togglePlay(false),
  step: () => SCENES[G.scene].stepOnce(G.S),
  reset: () => resetRun(false),
  finish: () => {
    const sc = SCENES[G.scene];
    let guard = 0;
    while (!isDone(G.S) && guard++ < 300000){ sc.stepOnce(G.S); sc.update(G.S, 0); }
    sc.update(G.S, 0);
    return isDone(G.S);
  },
  algorithms: { bruteGen, nnFrom, nnGen, twoOptGen, twoOptImprove, saGen, saProb, saAccept,
    hkGen, buildBoard, shuffledTour, mulberry32, tourCost, buildMatrix, haversine, distinctTours, isPermutation,
    bfsGen, wsearchGen, pathStats },
  cityScreen: (i) => toScreen(G.cities[i].lon, G.cities[i].lat),
  netScreen: (i) => { const p = rrProj(rrRects()[0]); return rrPt(NODE[i].lon, NODE[i].lat, p); },
  setJourney: (srcName, dstName) => {
    RR.src = NIDX[srcName];
    const pi = NET.pois.findIndex(p => p.name === dstName);
    RR.dst = pi >= 0 ? {poi:NET.pois[pi]} : {station:NIDX[dstName]};
    RR.preset = NET.journeys.findIndex(j => j.from === srcName && j.to === dstName);
    rrSyncSelects(); resetRun(true);
  },
  setObj: (obj) => { RR.obj = obj; resetRun(true); },
  testResults: null,
};

/* ---------------- init ---------------- */
function init(){
  resize();
  G.cities = citiesFromSlider(12);
  G.n = G.cities.length;
  G.M = buildMatrix(G.cities);
  computeProjection();
  switchScene(3, true);   // open on the money shot: 2-opt untangling itself
  requestAnimationFrame(frame);
  if (new URLSearchParams(location.search).get('test') === '1'){
    setTimeout(runTests, 400);
  }
}
new ResizeObserver(() => resize()).observe($('#stage-box'));
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
